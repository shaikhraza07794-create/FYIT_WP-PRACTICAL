<!DOCTYPE html>
<html>
    <head>
        <title>Emerging Technologies Information Portal</title>
        <link rel="stylesheet" href="P4.Q.5.css">
    </head>
    <header align="center">
        <h1>Emerging Technologies Information 
            <br>Portal</h1>
            <h2>Suggest a New Technology</h2>
            <hr>
            <nav>
                <a href="Home.html">Home</a> 
                <a href="Suggest.html">Suggest Technology</a>
            </nav>
            <hr>
            </header>
    <body>
    <h1 align="left">Technology Suggestion Form</h1>
    <div class="form-container">
    <form>
        <label>Name:</label><br>
        <input type="text" name="name">
        <br><br>
        <label>Email:</label><br>
        <input type="email" name="email">
        <br><br>
        <label>Contact Number:</label><br>
        <input type="number" name="contact">
        <br><br>
        <label>Technology Category:</label><br>
        <select name="category">
            <option value="Select">-Select Category-</option>
            <option value="AI">Artificial Intelligence</option>
            <option value="Cloud">Cloud Computing</option>
            <option value="Cyber">Cybersecurity</option>
            <option value="IoT">Internet of Things</option>
            <option value="Block">Blockchain</option>
        </select><br><br>
        <label>Technology Type:</label><br><br>
        <input type="radio" name="type" value="Software">Software
        <input type="radio" name="type" value="Hardware">Hardware
        <br><br>
        <label>Apllication Areas:</label><br><br>
        <input type="checkbox" name="application" value="Education">Education
        <input type="checkbox" name="application" value="Healthcare">Healthcare
        <input type="checkbox" name="application" value="Finance">Finance
        <input type="checkbox" name="application" value="Industry">Industry
        <br><br>
        <label>Year Introduced:</label><br>
        <input type="number" name="year">
        <br><br>
        <label>Technology Website:</label><br>
        <input type="url" name="website">
        <br><br>
        <label>Date of Submission:</label><br>
        <input type="date" name="submission_date">
        <br><br>
        <label>Technology Description:</label><br>
        <textarea name="description" rows="4" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <br><br>
    </form>
    </div>
    </body>
    <footer align="center">
        <hr>
        <p>Emerging Technologies Information Portal | Web Programming Laboratory</p>
        <hr>
    </footer>
</html>
