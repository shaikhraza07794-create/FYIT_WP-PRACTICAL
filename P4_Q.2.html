<!DOCTYPE html>
<html>
    <head>
        <title>
            Emerging Technologies in Information Technology
        </title>
    </head>
    <body>
        <!--Header-->
<header>
    <h1>Suggest a Technology </h1>   
</header>

<p>Use the folllowing to suggest an emerging that can be added to the portal.</p>
<!--Form-->
<form>
<label><b>Technology Name</b></label><br>
<input type ="text" name="Technology" size="30"><br><br>

<label><b>Organization Name :</b></label><br>
<input type="text" name="Organization" size="30"><br><br>

<label><b>Technology Category :</b></label><br>
<select name="--select category--">
    <option>Artifical Intelligence</option>
    <option>Cloud Computing</option>
    <option>Cyber Security</option>
    <option>IoT</option>
    <option>Blockchain</option>
    </select><br><br>

<label><b>Description :</b></label><br>
<textarea name="Description" rows="6" cols="40"></textarea><br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</body>
</html>
